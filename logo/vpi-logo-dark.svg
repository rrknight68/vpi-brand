<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400&display=swap');
      .name { font-family: 'Cinzel', serif; font-weight: 400; font-size: 58px;
              letter-spacing: 10.5px; fill: #FFFFFF; }
      .inv  { font-family: 'Cinzel', serif; font-weight: 400; font-size: 18px;
              letter-spacing: 3.6px; fill: #B0904E; }
    ]]></style>
  </defs>
  <!-- VANTAGE POINT — primary wordmark -->
